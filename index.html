<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>Ming</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    touch-action: none;      /* 手指拖动旋转，不触发页面滚动 */
  }
  /* 页面上唯一的文字 */
  .title {
    position: fixed;
    left: 2.5%;
    top: 32%;
    margin: 0;
    color: #ffffff;
    font-family: "Monotype Corsiva", "Brush Script MT", "Segoe Script", "Dancing Script", cursive;
    font-size: clamp(14px, min(2.8125vw, 5vh), 78px);
    line-height: 1.16;
    letter-spacing: 0.015em;
    width: max-content;          /* 宽度只由英文那行决定，署名右对齐就贴在英文右端 */
    text-shadow: 0 0 10px rgba(255, 226, 240, 0.55),
                 0 0 28px rgba(255, 172, 208, 0.34),
                 0 0 60px rgba(198, 160, 255, 0.22);
    opacity: 0;
    transform: translateY(12px);
    filter: blur(7px);
    will-change: opacity, transform, filter;
    animation: breathe 7s ease-in-out 3s infinite;
  }
  /* 英文那行：不换行 */
  .line {
    display: block;
    white-space: nowrap;
  }
  /* 破折号署名：另起一行、右对齐，落在英文的右下角 */
  .sign {
    display: block;
    text-align: right;
    font-style: normal;
    font-size: 0.72em;
    letter-spacing: 0.055em;
    opacity: 0.86;
    padding-top: 0.16em;
    white-space: nowrap;
  }
  /* 竖屏手机：文字居中放在树顶上方，不和树重叠 */
  @media (max-aspect-ratio: 1/1) {
    .title {
      left: 0;
      right: 0;
      margin: 0 auto;
      top: 7.5%;
      text-align: left;
      font-size: min(6.8vw, 3.9vh);
      letter-spacing: 0.03em;
    }
  }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 10px rgba(255, 226, 240, 0.55),
                            0 0 28px rgba(255, 172, 208, 0.34),
                            0 0 60px rgba(198, 160, 255, 0.22); }
    50%      { text-shadow: 0 0 14px rgba(255, 232, 244, 0.72),
                            0 0 40px rgba(255, 168, 206, 0.46),
                            0 0 80px rgba(198, 160, 255, 0.30); }
  }
  @media (prefers-reduced-motion: reduce) {
    .title { filter: none; }
  }
  /* 手势控制开关：只有一个图标，没有任何文字 */
  .cam {
    position: fixed;
    right: 14px;
    top: 14px;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.42);
    display: none;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: color .25s ease, background .25s ease, box-shadow .25s ease, opacity .25s ease;
    z-index: 10;
  }
  .cam.show { display: flex; }
  .cam.on {
    color: #ffd7ea;
    background: rgba(255, 176, 212, 0.16);
    box-shadow: 0 0 18px rgba(255, 160, 205, 0.45);
  }
  .cam.loading { animation: campulse 1.1s ease-in-out infinite; }
  .cam.hand { color: #ffffff; }
  @keyframes campulse {
    0%, 100% { opacity: .35; }
    50%      { opacity: .9; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<h1 class="title"><span class="line">December with You</span><em class="sign">&mdash;&mdash; Valyr</em></h1>

<script>
(function () {
  "use strict";

  /* ================= 相机参数（与原作一致） ================= */
  var CAM_DIST = 13.0;
  var CAM_HEIGHT = 6.0;
  var camDist = CAM_DIST;               // 实际相机距离：张开手拉近，握拳拉远
  var camDistT = CAM_DIST;
  var camOpen = 0.5;                    // 手掌张开程度 0=握拳 1=全张开
  var pitch = -0.25;                    // 俯仰角，可上下拖动
  var TREE_HEIGHT = 12.0;
  var TAU = Math.PI * 2;
  var cosP = Math.cos(pitch), sinP = Math.sin(pitch);

  var TREE_POINTS = 38000;
  var GROUND_POINTS = 3200;
  var STAR_POINTS = 1100;
  var HEART_POINTS = 900;

  /* ================= 画布与像素缓冲（自适应屏幕） ================= */
  var canvas = document.getElementById("scene");
  var W = 0, H = 0, dpr = 1, ctx = null, frameImg = null, pixels = null, zbuf = null;
  var FOCAL = 0, sizeScale = 1;

  function setupCanvas() {
    var cw = Math.max(240, window.innerWidth);
    var ch = Math.max(240, window.innerHeight);
    var deviceRatio = window.devicePixelRatio || 1;
    dpr = Math.min(deviceRatio, 2);
    // 限制渲染分辨率，保证手机上依然流畅
    var s = Math.min(dpr, 1150 / ch);
    W = Math.max(200, Math.round(cw * s));
    H = Math.max(200, Math.round(ch * s));

    canvas.width = W;
    canvas.height = H;

    ctx = canvas.getContext("2d", { alpha: false });
    frameImg = ctx.createImageData(W, H);
    pixels = new Uint32Array(frameImg.data.buffer);
    zbuf = new Float32Array(W * H);

    // 投影比例：横屏按高度（保持原作视角），竖屏按宽度（树完整不裁）
    FOCAL = Math.min(H * 0.63, W * 0.88);
    sizeScale = Math.max(0.7, FOCAL / (900 * 0.63));
  }

  function pack(r, g, b) {
    r = r < 0 ? 0 : (r > 255 ? 255 : r | 0);
    g = g < 0 ? 0 : (g > 255 ? 255 : g | 0);
    b = b < 0 ? 0 : (b > 255 ? 255 : b | 0);
    return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  }

  var posArr = [];
  var colArr = [];
  function add(x, y, z, c) {
    posArr.push(x, y, z);
    colArr.push(c);
  }

  /* 高斯随机（复现 random.gauss） */
  var gaussSpare = null;
  function gauss(mu, sigma) {
    if (gaussSpare !== null) {
      var v = gaussSpare;
      gaussSpare = null;
      return mu + sigma * v;
    }
    var u = 0, v2 = 0;
    while (u === 0) u = Math.random();
    while (v2 === 0) v2 = Math.random();
    var mag = Math.sqrt(-2 * Math.log(u));
    gaussSpare = mag * Math.sin(TAU * v2);
    return mu + sigma * (mag * Math.cos(TAU * v2));
  }

  /* ================= 圣诞树 ================= */
  // 深紫 / 玫瑰红点缀色：约占全部树粒子的 26%
  function accentColor() {
    if (Math.random() < 0.46) {                      // 深紫
      var pv = Math.random();
      return pack(104 + Math.floor(pv * 54), 30 + Math.floor(pv * 34), 138 + Math.floor(pv * 66));
    }
    var rv = Math.random();                          // 玫瑰红
    return pack(200 + Math.floor(rv * 55), 30 + Math.floor(rv * 32), 82 + Math.floor(rv * 46));
  }

  function genTree() {
    var loops = 9;
    var spiralN = Math.floor(TREE_POINTS * 0.7);
    var i, u, h, y, baseR, wave, t, ang, r, x, z, mid, g, b;

    // 70% 螺旋灯带
    for (i = 0; i < spiralN; i++) {
      u = Math.random();
      h = Math.pow(u, 1.6);
      y = TREE_HEIGHT * h + 0.2;

      baseR = Math.pow(1 - h, 1.1) * 3.2;
      wave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= 1.0 + 0.65 * wave;

      t = u * loops * TAU;
      ang = t + (Math.random() * 0.44 - 0.22);
      r = baseR * (0.85 + Math.random() * 0.23);
      x = Math.cos(ang) * r;
      z = Math.sin(ang) * r;

      mid = 1.0 - Math.abs(h - 0.55) * 1.5;
      if (mid < 0.15) mid = 0.15;
      g = 155 + Math.floor(90 * mid);
      b = 185 + Math.floor(70 * mid);
      g = Math.min(255, g + Math.floor(Math.random() * 36) - 15);
      b = Math.min(255, b + Math.floor(Math.random() * 51) - 15);

      if (Math.random() < 0.26) { add(x, y, z, accentColor()); continue; }   // 深紫 / 玫瑰红点缀

      if (Math.random() < 0.08) {
        g = 255 - Math.floor(Math.random() * 36);
        b = 230 + Math.floor(Math.random() * 26);
      }
      add(x, y, z, pack(255, g, b));
    }

    // 30% 随机填充
    for (i = spiralN; i < TREE_POINTS; i++) {
      h = Math.pow(Math.random(), 1.9);
      y = TREE_HEIGHT * h + 0.2 + (Math.random() * 0.16 - 0.08);

      baseR = Math.pow(1 - h, 1.1) * 4.3;
      wave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= 1.0 + 0.65 * wave;

      r = baseR * Math.sqrt(Math.random());
      ang = Math.random() * TAU;
      x = Math.cos(ang) * r + (Math.random() * 0.16 - 0.08);
      z = Math.sin(ang) * r + (Math.random() * 0.16 - 0.08);

      g = 165 + Math.floor(Math.random() * 61);
      b = 190 + Math.floor(Math.random() * 61);
      if (Math.random() < 0.26) { add(x, y, z, accentColor()); continue; }   // 深紫 / 玫瑰红点缀
      add(x, y, z, pack(255, g, b));
    }
  }

  /* ================= 地面光环 ================= */
  function genGround() {
    var rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
    for (var i = 0; i < GROUND_POINTS; i++) {
      var ring = rings[Math.floor(Math.random() * rings.length)];
      var r = gauss(ring, 0.3);
      var th = Math.random() * TAU;
      var c = Math.random() < 0.15 ? 235 + Math.floor(Math.random() * 21)
                                   : 190 + Math.floor(Math.random() * 46);
      add(Math.cos(th) * r, -0.25, Math.sin(th) * r, pack(c, c, 255));
    }
  }

  /* ================= 空中亮点 ================= */
  function genStars() {
    for (var i = 0; i < STAR_POINTS; i++) {
      var x = Math.random() * 36 - 18;
      var z = Math.random() * 36 - 18;
      var y = 3 + Math.random() * 15;
      var base = 215 + Math.floor(Math.random() * 41);
      add(x, y, z, pack(base, base, 255));
    }
  }

  /* ================= 树顶 3D 爱心 ================= */
  function genHeart() {
    var scale = 0.9;
    var topY = TREE_HEIGHT + 0.05;
    var n = 0;
    while (n < HEART_POINTS) {
      var x = Math.random() * 2.6 - 1.3;
      var y = Math.random() * 2.8 - 1.4;
      var f = Math.pow(x * x + y * y - 1.0, 3) - x * x * Math.pow(y, 3);
      if (f <= 0.0) {
        var wx = x * scale * 0.8;
        var wy = topY + (y + 1.0) * scale * 0.5;
        var wz = Math.random() * 0.36 - 0.18;
        var dist = Math.sqrt(x * x + y * y);
        var factor = 1.15 - 0.5 * dist;
        if (factor < 0.35) factor = 0.35;
        var g = Math.floor(130 * factor + 80);
        var b = Math.floor(190 * factor + 70);
        g = g < 120 ? 120 : (g > 255 ? 255 : g);
        b = b < 120 ? 120 : (b > 255 ? 255 : b);
        add(wx, wy, wz, pack(255, g, b));
        n++;
      }
    }
  }

  genTree();
  genGround();
  genStars();
  genHeart();

  var COUNT = posArr.length / 3;
  var P = new Float32Array(posArr);
  var C = new Uint32Array(colArr);
  posArr = null; colArr = null;

  /* ================= 按高度分层：让树身粒子沿外形轮廓一圈圈绕着走 ================= */
  // 每一层给一个自己的角速度，上下层错开，整棵树表面就像有粒子在绕轮廓流动
  var BANDS = 22;
  var BND = new Uint8Array(COUNT);
  var bandPhase = new Float32Array(BANDS);
  var bandSpeed = new Float32Array(BANDS);
  var bandCos = new Float32Array(BANDS), bandSin = new Float32Array(BANDS);
  for (var bi = 0; bi < BANDS; bi++) {
    bandSpeed[bi] = 0.18 + bi * 0.035;           // 越往上流得越快
  }
  for (var cii = 0; cii < COUNT; cii++) {
    if (cii >= TREE_POINTS) { BND[cii] = 255; continue; }   // 地面/星空/爱心不参与分层绕转
    var hy0 = P[cii * 3 + 1];
    var bd = Math.floor(hy0 / TREE_HEIGHT * BANDS);
    if (bd < 0) bd = 0;
    if (bd >= BANDS) bd = BANDS - 1;
    BND[cii] = bd;
  }

  /* ================= 绕树外形轮廓转圈的粒子 ================= */
  // 树在高度 h 处的外轮廓半径（与 genTree 同一套公式）
  function treeRadius(h) {
    var baseR = Math.pow(1 - h, 1.1) * 4.3;
    var wave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
    return baseR * (1.0 + 0.65 * wave);
  }
  var ORBIT_N = 320;
  var OR = new Float32Array(ORBIT_N * 3);   // 实时坐标
  var OR_H = new Float32Array(ORBIT_N);
  var OR_TH = new Float32Array(ORBIT_N);
  var OR_RF = new Float32Array(ORBIT_N);
  var OR_SP = new Float32Array(ORBIT_N);
  var OR_C = new Uint32Array(ORBIT_N);
  var OR_CB = new Uint32Array(ORBIT_N);
  var OR_CC = new Uint32Array(ORBIT_N);
  for (var oi = 0; oi < ORBIT_N; oi++) {
    OR_H[oi] = 0.02 + Math.random() * 0.98;
    OR_TH[oi] = Math.random() * TAU;
    OR_RF[oi] = 1.30 + Math.random() * 0.32;        // 贴着轮廓外侧的轨道，转起来才看得清
    OR_SP[oi] = 0.55 + Math.random() * 0.5;         // 各自不同的角速度，形成疏密层次
    var oc = Math.random();
    OR_C[oi] = oc < 0.55 ? pack(255, 255, 255) : (oc < 0.8 ? pack(255, 238, 250) : (oc < 0.9 ? pack(232, 132, 168) : pack(158, 92, 186)));
    OR_CB[oi] = oc < 0.55 ? pack(238, 200, 224) : (oc < 0.8 ? pack(228, 176, 206) : (oc < 0.9 ? pack(198, 96, 130) : pack(126, 70, 152)));
    OR_CC[oi] = oc < 0.9 ? pack(150, 110, 140) : pack(96, 52, 118);
  }
  var orbitPhase = 0;

  /* ================= 前景雪花 ================= */
  var snowSprite = (function () {
    var s = 128;
    var c = document.createElement("canvas");
    c.width = c.height = s;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0.00, "rgba(255,255,255,1)");
    grad.addColorStop(0.16, "rgba(255,255,255,0.88)");
    grad.addColorStop(0.38, "rgba(255,255,255,0.40)");
    grad.addColorStop(0.68, "rgba(255,255,255,0.11)");
    grad.addColorStop(1.00, "rgba(255,255,255,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return c;
  })();

  var FLAKE_N = 14;
  var flakes = [];
  function respawn(f) {
    f.x = Math.random() * W;
    f.y = Math.random() * (H * 0.08) - H * 0.09;
    f.r = (10 + Math.random() * 6) * sizeScale;
    f.v = (30 + Math.random() * 15) * sizeScale;
    f.life = (H + 80 * sizeScale - f.y) / f.v;
    f.maxLife = f.life;
  }
  function resetFlakes(spread) {
    flakes.length = 0;
    for (var i = 0; i < FLAKE_N; i++) {
      var f = {};
      respawn(f);
      if (spread) {
        f.y = Math.random() * H;
        f.life = (H + 80 * sizeScale - f.y) / f.v;
        f.maxLife = f.life;
      }
      flakes.push(f);
    }
  }

  function updateSnow(dt) {
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.v * dt;
      f.life -= dt;
      if (f.life <= 0 || f.y > H + 60) respawn(f);
    }
  }

  function drawSnow() {
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      var phase = f.life / f.maxLife;
      var a = phase > 0.3 ? 1 : Math.max(0, phase / 0.3);
      if (a <= 0) continue;
      var d = f.r * 5.2;
      ctx.globalAlpha = a;
      ctx.drawImage(snowSprite, f.x - d / 2, f.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  /* ================= 初始化 / 自适应 ================= */
  setupCanvas();
  resetFlakes(true);

  var resizeTimer = null;
  function onResize() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      setupCanvas();
      resetFlakes(true);
    }, 160);
  }
  window.addEventListener("resize", onResize, false);
  window.addEventListener("orientationchange", onResize, false);
  // 从后台切回来时重置时间基准，避免一次超大步进
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) lastT = 0;
  }, false);

  /* ================= 主循环 ================= */
  var yaw = 0;                 // 水平旋转角
  var yawVel = 0, pitchVel = 0; // 松手后的惯性
  var spin = 0.27;             // 当前自动旋转速度
  var idle = 99;               // 空闲计时
  var dragging = false;
  var lastT = 0;
  var startT = 0;
  var titleEl = document.querySelector(".title");

  function enterTitle(t) {
    var e = (t - 0.5) / 2.0;
    if (e < 0) e = 0;
    else if (e > 1) e = 1;
    e = 1 - Math.pow(1 - e, 3);
    titleEl.style.opacity = e.toFixed(3);
    titleEl.style.transform = "translateY(" + ((1 - e) * 12).toFixed(2) + "px)";
    titleEl.style.filter = e > 0.995 ? "none" : "blur(" + ((1 - e) * 7).toFixed(2) + "px)";
  }

  function render(now) {
    requestAnimationFrame(render);   // 先预约下一帧：单帧出错也不会让动画停住
    try {
    if (!lastT) { lastT = now; startT = now; }
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    // 任何时刻都不让画面停住：拖动时也保留慢速自转，松手立刻回到正常速度
    idle += dt;
    var targetSpin = dragging ? 0.12 : 0.27;
    spin += (targetSpin - spin) * Math.min(1, dt * 2.2);
    // 手势：手停在哪边，树就往哪边持续转（摇杆式），偏得越多转得越快
    if (camPhase === 2) {
      var camDead = Math.abs(camNX) > 0.055 ? Math.abs(camNX) - 0.055 : 0;
      var camTarget = (camNX > 0 ? camDead : -camDead) * 3.4;
      camYaw += (camTarget - camYaw) * Math.min(1, dt * 5.0);
    } else {
      camYaw = 0;
    }
    yaw += (spin + (dragging ? 0 : yawVel) - camYaw) * dt;
    pitch += (dragging ? 0 : pitchVel) * dt;
    // 手抬高/放低 → 视角跟着上下
    if (camPhase === 2 && camHand) {
      var tp = -0.25 + camNY * 1.2;
      if (tp < -1.05) tp = -1.05;
      if (tp > 0.85) tp = 0.85;
      pitch += (tp - pitch) * Math.min(1, dt * 4.0);
    }
    // 张开手掌 → 相机往里推（一路推进到树内部）；握拳 → 拉远变小
    if (camPhase === 2 && camHand) {
      camDistT = 22.0 - camOpen * 18.8;
    } else if (camPhase === 0) {
      camDistT = CAM_DIST;
    }
    camDist += (camDistT - camDist) * Math.min(1, dt * 3.2);
    if (camDist < 1.6) camDist = 1.6;
    var damp = Math.pow(0.94, dt * 60);
    yawVel *= damp;
    pitchVel *= damp;
    if (Math.abs(yawVel) < 0.001) yawVel = 0;
    if (Math.abs(pitchVel) < 0.001) pitchVel = 0;
    if (pitch < -1.05) { pitch = -1.05; pitchVel = 0; }
    if (pitch > 0.85) { pitch = 0.85; pitchVel = 0; }
    cosP = Math.cos(pitch); sinP = Math.sin(pitch);

    enterTitle((now - startT) / 1000);
    updateSnow(dt);

    pixels.fill(0xff000000);
    zbuf.fill(1e9);

    var cosA = Math.cos(yaw), sinA = Math.sin(yaw);
    var halfW = W * 0.5, halfH = H * 0.5;

    // 让环绕粒子沿树的外轮廓走
    orbitPhase += dt;
    if (orbitPhase > 1e4) orbitPhase = 0;

    // 分层绕转：每层相位自己走，预存 cos/sin，循环里只查表
    for (var bb = 0; bb < BANDS; bb++) {
      bandPhase[bb] += dt * bandSpeed[bb];
      if (bandPhase[bb] > TAU) bandPhase[bb] -= TAU;
      var ab = yaw + bandPhase[bb];
      bandCos[bb] = Math.cos(ab);
      bandSin[bb] = Math.sin(ab);
    }

    for (var i = 0; i < COUNT; i++) {
      var k3 = i * 3;
      var px = P[k3], py = P[k3 + 1], pz = P[k3 + 2];

      var bnd = BND[i];
      var ca = cosA, sa = sinA;
      if (bnd !== 255) { ca = bandCos[bnd]; sa = bandSin[bnd]; }
      var xz = px * ca - pz * sa;
      var zz = px * sa + pz * ca;
      var yp = py * cosP - zz * sinP - CAM_HEIGHT;
      var zp = py * sinP + zz * cosP + camDist;
      if (zp <= 0.1) continue;

      var fscale = FOCAL / zp;
      var sx = (halfW + xz * fscale) | 0;
      var sy = (halfH - yp * fscale) | 0;
      if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) continue;

      var zs = CAM_DIST / camDist;                 // 拉近点变大，拉远变小
      if (zs > 2.6) zs = 2.6;
      var size = (3.7 - zp * 0.135) * sizeScale * Math.pow(zs, 0.45);
      if (size < 1) size = 1;
      if (size > 10 * sizeScale) size = 10 * sizeScale;
      var r = (size + 0.5) | 0;
      var rn = r * r + r;
      var col = C[i];

      for (var dy = -r; dy <= r; dy++) {
        var yy = sy + dy;
        if (yy < 0 || yy >= H) continue;
        var row = yy * W;
        var dy2 = dy * dy;
        for (var dx = -r; dx <= r; dx++) {
          if (dx * dx + dy2 > rn) continue;
          var xx = sx + dx;
          if (xx < 0 || xx >= W) continue;
          var idx = row + xx;
          if (zbuf[idx] > zp) {
            zbuf[idx] = zp;
            pixels[idx] = col;
          }
        }
      }
    }

    // 绕着树外形轮廓转圈的粒子（带一小段尾迹，一眼能看出在转）
    for (var oj = 0; oj < ORBIT_N; oj++) {
      var oh = OR_H[oj];
      var orad = treeRadius(oh) * OR_RF[oj];
      var oyy0 = TREE_HEIGHT * oh + 0.2;
      var a0 = OR_TH[oj] + orbitPhase * OR_SP[oj];
      for (var tr = 0; tr < 4; tr++) {
        var ta = a0 - tr * 0.062;                     // 尾迹：稍微落在后面
        var tx = Math.cos(ta) * orad;
        var tz = Math.sin(ta) * orad;
        var txz = tx * cosA - tz * sinA;
        var tzz = tx * sinA + tz * cosA;
        var typ = oyy0 * cosP - tzz * sinP - CAM_HEIGHT;
        var tzp = oyy0 * sinP + tzz * cosP + camDist;
        if (tzp <= 0.1) continue;
        var tf = FOCAL / tzp;
        var tsx = (halfW + txz * tf) | 0;
        var tsy = (halfH - typ * tf) | 0;
        if (tsx < -6 || tsx > W + 6 || tsy < -6 || tsy > H + 6) continue;
        var ts = (4.2 - tzp * 0.12) * sizeScale * (1 - tr * 0.2);
        if (ts < 1) ts = 1;
        var trr = (ts + 0.5) | 0;
        var trn = trr * trr + trr;
        var tc = tr === 0 ? OR_C[oj] : (tr === 1 ? OR_CB[oj] : OR_CC[oj]);
        for (var tdy = -trr; tdy <= trr; tdy++) {
          var tyy = tsy + tdy;
          if (tyy < 0 || tyy >= H) continue;
          var trow = tyy * W;
          var tdy2 = tdy * tdy;
          for (var tdx = -trr; tdx <= trr; tdx++) {
            if (tdx * tdx + tdy2 > trn) continue;
            var txx = tsx + tdx;
            if (txx < 0 || txx >= W) continue;
            var tidx = trow + txx;
            if (zbuf[tidx] > tzp) { zbuf[tidx] = tzp; pixels[tidx] = tc; }
          }
        }
      }
    }

    ctx.putImageData(frameImg, 0, 0);
    drawSnow();
    } catch (err) { lastT = 0; }   // 单帧异常兜底，动画不中断
  }

  /* ================= 手指 / 鼠标拖动旋转 ================= */
  var K_YAW = 0.0115;      // 每像素对应的水平旋转角（拖动半个屏幕约转 180°）
  var K_PITCH = 0.0072;    // 每像素对应的俯仰角
  var lastX = 0, lastY = 0, lastMoveT = 0;

  function onDown(e) {
    dragging = true;
    idle = 0;
    yawVel = 0; pitchVel = 0;
    lastX = e.clientX; lastY = e.clientY;
    lastMoveT = performance.now();
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.cancelable) e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;

    yaw -= dx * K_YAW;                     // 跟手：手指往哪边推，树就往哪边转
    pitch += dy * K_PITCH;
    if (pitch < -1.05) pitch = -1.05;
    if (pitch > 0.85) pitch = 0.85;

    var now = performance.now();
    var dtm = Math.max(1, now - lastMoveT) / 1000;
    lastMoveT = now;
    yawVel = (-dx * K_YAW) / dtm;
    pitchVel = (dy * K_PITCH) / dtm;
    if (yawVel > 3.2) yawVel = 3.2;
    if (yawVel < -3.2) yawVel = -3.2;
    if (pitchVel > 2.0) pitchVel = 2.0;
    if (pitchVel < -2.0) pitchVel = -2.0;

    if (e.cancelable) e.preventDefault();
  }

  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    idle = 0;
    // 松手前已停住不动 → 不给惯性
    if (performance.now() - lastMoveT > 120) { yawVel = 0; pitchVel = 0; }
    if (canvas.releasePointerCapture) {
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  }

  canvas.addEventListener("pointerdown", onDown, { passive: false });
  window.addEventListener("pointermove", onMove, { passive: false });
  window.addEventListener("pointerup", onUp, false);
  window.addEventListener("pointercancel", onUp, false);
  // 兜底：老浏览器没有 Pointer Events 时用触摸事件
  if (!window.PointerEvent) {
    canvas.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      onDown({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, pointerId: 1, cancelable: true, preventDefault: function () { e.preventDefault(); } });
    }, { passive: false });
    canvas.addEventListener("touchmove", function (e) {
      if (e.touches.length !== 1) return;
      onMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, cancelable: true, preventDefault: function () { e.preventDefault(); } });
    }, { passive: false });
    canvas.addEventListener("touchend", function () { onUp({}); }, false);
  }

  /* ================= 摄像头手势控制（可选、懒加载） ================= */
  var HANDS_PKG = "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/";
  var camBtn = null, camVideo = null, camHands = null, camStream = null;
  var camOn = false, camBusy = false, camTimer = null, camToken = 0;
  var camPhase = 0;                        // 0=关闭 1=准备中 2=已开启
  var camHand = 0, camNX = 0, camNY = 0, camYaw = 0, camLastNX = null;

  function camSupported() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
    // 微信 / QQ / 微博 内置浏览器拿不到摄像头权限，直接不显示入口
    if (/micromessenger|mqqbrowser|weibo/i.test(navigator.userAgent)) return false;
    return true;
  }

  function camIcon() {
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h4l2 3h4a2 2 0 0 1 2 2z"/>' +
      '<circle cx="12" cy="13" r="3.6"/></svg>';
  }

  function camStop() {
    camOn = false;
    camBusy = false;
    camPhase = 0;
    camToken++;
    if (camTimer) { clearInterval(camTimer); camTimer = null; }
    if (camStream) {
      try { camStream.getTracks().forEach(function (t) { t.stop(); }); } catch (err) {}
      camStream = null;
    }
    if (camVideo) {
      try { camVideo.pause(); camVideo.srcObject = null; } catch (err) {}
    }
    camHand = 0; camNX = 0; camNY = 0; camYaw = 0; camLastNX = null;
    if (camBtn) {
      camBtn.classList.remove("on");
      camBtn.classList.remove("hand");
      camBtn.classList.remove("loading");
    }
  }

  function onCamResults(results) {
    var lms = results.multiHandLandmarks;
    var lm = lms && lms.length ? lms[0] : null;
    if (!lm) {
      camHand = 0;
      camNX = 0;
      camNY = 0;
      camLastNX = null;
      if (camBtn) camBtn.classList.remove("hand");
      return;
    }
    camHand = 1;
    var palm = lm[9];                        // 中指根部 ≈ 掌心
    var nx = (1 - palm.x) - 0.5;             // 左右偏移（摄像头画面镜像翻回来）
    var ny = palm.y - 0.5;                   // 上下偏移
    camNX = nx;
    camNY = ny;

    // 手掌张开度：指尖到腕部的平均距离 / 掌心尺寸；握拳时小，张开时大
    var w0 = lm[0];
    var palmW = Math.sqrt((w0.x - palm.x) * (w0.x - palm.x) + (w0.y - palm.y) * (w0.y - palm.y));
    if (palmW < 0.004) palmW = 0.004;
    var tips = [8, 12, 16, 20];
    var spread = 0;
    for (var ti = 0; ti < tips.length; ti++) {
      var q = lm[tips[ti]];
      spread += Math.sqrt((q.x - w0.x) * (q.x - w0.x) + (q.y - w0.y) * (q.y - w0.y));
    }
    spread /= tips.length;
    var ratio = spread / palmW;
    var openRaw = (ratio - 1.45) / (2.10 - 1.45);   // 1.45≈握拳 2.10≈完全张开
    if (openRaw < 0) openRaw = 0;
    if (openRaw > 1) openRaw = 1;
    camOpen += (openRaw - camOpen) * 0.35;          // 平滑，避免抖动
    if (camBtn) camBtn.classList.add("hand");
    // 瞬时跟手：手一挥，树立刻跟着走
    if (camLastNX === null) { camLastNX = nx; return; }
    var dx = nx - camLastNX;
    camLastNX = nx;
    if (Math.abs(dx) > 0.0012) yaw -= dx * 5.0;
  }

  function camLoop() {
    if (camTimer) clearInterval(camTimer);
    camTimer = setInterval(function () {
      if (!camOn || camBusy || !camHands) return;
      if (!camVideo || camVideo.readyState < 2) return;
      camBusy = true;
      var settled = false;
      var t = setTimeout(function () {          // 单次识别超时，避免永久卡住
        if (!settled) { settled = true; camBusy = false; }
      }, 6000);
      function done() {
        if (!settled) { settled = true; clearTimeout(t); camBusy = false; }
      }
      try {
        camHands.send({ image: camVideo }).then(done, done);
      } catch (err) { done(); }
    }, 110);                                    // 约 9 帧/秒识别，给渲染让出性能
  }

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error("load fail")); };
      document.head.appendChild(s);
    });
  }

  function camStart() {
    if (camPhase === 2) { camStop(); return; }     // 已开启 → 关闭
    if (camPhase === 1) return;                    // 准备中 → 忽略重复点击
    camPhase = 1;
    var tk = ++camToken;
    if (camBtn) camBtn.classList.add("loading");

    var phaseTimer = setTimeout(function () {      // 25 秒内没跑起来就复原
      if (tk === camToken && camPhase !== 2) camStop();
    }, 25000);

    function fail() {
      if (tk === camToken) camStop();
    }

    Promise.resolve()
      .then(function () {
        if (tk !== camToken) throw 0;
        if (!window.Hands) return loadScript(HANDS_PKG + "hands.js");
      })
      .then(function () {
        if (tk !== camToken) throw 0;
        if (!camHands) {
          camHands = new window.Hands({ locateFile: function (f) { return HANDS_PKG + f; } });
          camHands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.45
          });
          camHands.onResults(onCamResults);
        }
        return navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: "user", width: 320, height: 240, frameRate: 15 }
        });
      })
      .then(function (stream) {
        if (tk !== camToken) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} throw 0; }
        camStream = stream;
        if (!camVideo) {
          camVideo = document.createElement("video");
          camVideo.playsInline = true;
          camVideo.muted = true;
          camVideo.autoplay = true;
          camVideo.setAttribute("playsinline", "");
          // 放在视口内但几乎不可见：太靠外会被浏览器当成离屏视频而暂停解码
          camVideo.style.cssText = "position:fixed;left:0;top:0;width:4px;height:3px;opacity:0.01;pointer-events:none;z-index:-1;";
          document.body.appendChild(camVideo);
        }
        camVideo.srcObject = stream;
        var p = camVideo.play();
        if (p && p.catch) p.catch(function () {});
        // 预热：先送一帧空白图，把 5MB 模型下载下来并把推理初始化好
        var warm = document.createElement("canvas");
        warm.width = 64; warm.height = 48;
        var wctx = warm.getContext("2d");
        wctx.fillStyle = "#808080";
        wctx.fillRect(0, 0, 64, 48);
        return camHands.send({ image: warm });
      })
      .then(function () {
        if (tk !== camToken) throw 0;
        clearTimeout(phaseTimer);
        camOn = true;
        camPhase = 2;                              // 只有推理真的跑通了才点亮
        camHand = 0; camNX = 0; camNY = 0; camYaw = 0; camLastNX = null;
        if (camBtn) {
          camBtn.classList.remove("loading");
          camBtn.classList.add("on");
        }
        camLoop();
      })
      .catch(function () { fail(); });              // 任何一步失败 → 静默退回触摸拖动
  }

  if (camSupported()) {
    camBtn = document.createElement("button");
    camBtn.className = "cam";
    camBtn.type = "button";
    camBtn.setAttribute("aria-label", "gesture");
    camBtn.innerHTML = camIcon();
    camBtn.addEventListener("click", function (e) {
      e.preventDefault();
      camStart();
    }, false);
    document.body.appendChild(camBtn);
    camBtn.classList.add("show");
    // 页面被切走时释放摄像头，别让它一直亮着
    document.addEventListener("visibilitychange", function () {
      if (document.hidden && camOn) camStop();
    }, false);
  }

  requestAnimationFrame(render);

  /* ================= 背景音乐：整首循环、没有开关 ================= */
  var audioCtx = null, musicBuf = null, musicOn = false, musicWant = false, musicEl = null;
  var musicNext = 0, musicTimer = null;
  var MUSIC_XF = 0.8;                        // 首尾交叉淡化 0.8 秒，衔接听不出断点

  function musicFallback() {                 // 解码失败时退回 <audio loop>（一样没有开关）
    if (musicOn) return;
    try {
      if (!musicEl) {
        musicEl = new Audio("music.mp3");
        musicEl.loop = true;
        musicEl.preload = "auto";
        musicEl.setAttribute("playsinline", "");
        musicEl.style.display = "none";
        document.body.appendChild(musicEl);
      }
      var pr = musicEl.play();
      if (pr && pr.catch) pr.catch(function () {});
      musicOn = true;
    } catch (e) {}
  }

  // 每一段都是「整首 + 开头淡入 + 结尾淡出」，相邻两段重叠 1.6 秒首尾相接
  function musicSeg(at) {
    if (!musicBuf || !audioCtx) return;
    var dur = musicBuf.duration;
    if (at < audioCtx.currentTime + 0.03) at = audioCtx.currentTime + 0.03;
    try {
      var node = audioCtx.createBufferSource();
      node.buffer = musicBuf;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(1, at + MUSIC_XF);
      g.gain.setValueAtTime(1, at + dur - MUSIC_XF);
      g.gain.linearRampToValueAtTime(0.0001, at + dur);
      node.connect(g);
      g.connect(audioCtx.destination);
      node.start(at);
      try { node.stop(at + dur + 0.03); } catch (e) {}
    } catch (e) { return; }
    var next = at + dur - MUSIC_XF;
    musicNext = next;
    var delay = (next - audioCtx.currentTime - 0.3) * 1000;
    if (musicTimer) clearTimeout(musicTimer);
    musicTimer = setTimeout(function () { musicSeg(next); }, Math.max(80, delay));
  }

  function musicStartNode() {
    if (musicOn || !musicBuf || !audioCtx) return;
    try {
      musicOn = true;
      musicSeg(audioCtx.currentTime + 0.1);
    } catch (e) { musicOn = false; musicFallback(); }
  }

  function musicKick() {
    if (musicOn || !musicBuf || !audioCtx) return;
    try {
      if (audioCtx.state === "suspended") {
        var r = audioCtx.resume();
        if (r && r.then) { r.then(musicStartNode, function () {}); return; }
        return;
      }
      musicStartNode();
    } catch (e) { musicFallback(); }
  }

  function musicStart() {
    musicWant = true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { musicFallback(); return; }
    if (!audioCtx) {
      try { audioCtx = new AC(); } catch (e) { musicFallback(); return; }
      try { audioCtx.resume(); } catch (e) {}
      fetch("music.mp3")
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) {
          audioCtx.decodeAudioData(ab, function (buf) {
            musicBuf = buf;
            musicKick();
          }, function () { musicFallback(); });
        })
        .catch(function () { musicFallback(); });
    }
    musicKick();
  }

  // 浏览器规定必须有交互才能出声：第一次触摸/点击/按键就自动开始，之后一直循环、无法关闭
  ["pointerdown", "touchstart", "mousedown", "keydown", "click"].forEach(function (ev) {
    window.addEventListener(ev, function () { if (!musicOn) musicStart(); }, true);
  });
  window.addEventListener("visibilitychange", function () {
    if (document.hidden || !musicWant) return;
    musicKick();
    // 回到前台时如果调度链已经断了，立刻补一段接上
    if (musicOn && audioCtx && (!musicNext || musicNext - audioCtx.currentTime < 0.15)) {
      musicSeg(audioCtx.currentTime + 0.1);
    }
  });
  try { musicStart(); } catch (e) {}

  // 兜底：极端情况下（后台标签页 rAF 被节流）也保证文字最终可见
  setTimeout(function () {
    titleEl.style.opacity = "1";
    titleEl.style.transform = "none";
    titleEl.style.filter = "none";
  }, 3200);
})();
</script>
</body>
</html>
